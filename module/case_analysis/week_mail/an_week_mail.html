<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">

    <title>ㄧ週報</title>

<body >

<h2 style=" font-size: 22px; font-family: Microsoft JhengHei;">GOOGLE分析 - {case_name}</h2>

    <h3 style="font-size: 15px; font-family: Microsoft JhengHei;">時間：{StartDate} ~ {EndDate}</h3>
</div>
<div>
    <table border="1" cellspacing="0" cellpadding="10" style="width: 360px; font-family: Microsoft JhengHei;">
        <tbody>
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">一周瀏覽人數</td>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">一個月瀏覽人數</td>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">總瀏覽人數</td>
            </tr>
            <tr>
                <td style="text-align: center; font-size: 1.2em; ">{week_users}人</td>
                <td style="text-align: center; font-size: 1.2em; ">{month_users}人</td>
                <td style="text-align: center; font-size: 1.2em; ">{all_users}人</td>
            </tr>

        </tbody>
    </table>
</div>

<div>

    <table border="1" cellspacing="0" cellpadding="10" style="width: 360px;">
        <tbody>
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">女性</td>

            </tr>

                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">男性</td>
                <td style="text-align: center; font-size: 1.2em; ">{male}</td>
            </tr>

        </tbody>
    </table>
</div>

    <table border="1" cellspacing="0" cellpadding="10" style="width: 360px;">
        <tbody>
            
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">18-24歲</td>
                <td style="width: 100px; text-align: center; font-size: 1.2em; ">{18-24}</td>
            </tr>
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">25-34歲</td>

            </tr>
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">45-54歲</td>
                <td style="text-align: center; font-size: 1.2em; ">{45-54}</td>
            </tr>
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">55-64歲</td>
                <td style="text-align: center; font-size: 1.2em; ">{55-64}</td>
            </tr>
            <tr>
                <td style="font-family: Microsoft JhengHei; font-size: 1.2em; ">65+歲</td>
                <td style="text-align: center; font-size: 1.2em; ">{65+}</td>
            </tr>
        </tbody>
    </table>
</div>
