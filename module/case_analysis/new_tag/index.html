	<script type="text/javascript">
		$(document).ready(function() {


            $('#sub_btn').click(function (e) { 
				
				var err_txt = '';
				err_txt = err_txt + check_input('#tab_name', '名稱\n');
				err_txt = err_txt + check_input('#an_StartDate', '分析開始日\n');
				err_txt = err_txt + check_input('#an_EndDate', '分析結束日\n');

				if($('#compare_ch').prop('checked')==true){
                    err_txt = err_txt + check_input('#com_StartDate', '比較開始日\n');
					err_txt = err_txt + check_input('#com_EndDate', '比較結束日\n');
				}

				if (err_txt != '') {
					alert("以下欄位為空值或是帶有特殊符號\n" + err_txt);
				}
				else {
					var case_id=location.search;
					    case_id= case_id.substr(1);
					$.ajax({
						type: "POST",
						url: "tag_ajax.php",
						data: {
						  type: 'insert',
						  case_id: case_id,
                          tab_name:$('#tab_name').val(),
						  an_StartDate: $('#an_StartDate').val(),
						  an_EndDate: $('#an_EndDate').val(),
						  com_StartDate: $('#com_StartDate').val(),
						  com_EndDate: $('#com_EndDate').val(),
						},
						success: function (data) {
						   alert('成功新增標籤');
						   window.parent.location.reload();
						}
					});
				}
			});


			$('#close_btn').click(function (e) { 
				parent.jQuery.fancybox.getInstance().close();
			});


			$('#compare_ch').change(function(event) {
			  if ($(this).prop('checked')==true) {
			  	 $('#compare_date').css('display', 'block');
			  }
			  else{
			  	 $('#compare_date').css('display', 'none');
			  	 $('#compare_date input').val('');
			  }
			});



		   //-- 分析日期 --
		    var from= $('#an_StartDate' ).datepicker({
		              dateFormat: "yy-mm-dd",
		              yearRange: "-10:+10",
		              changeMonth: true,
		              changeYear: true,
		              dayNamesMin :["日","一","二","三","四","五","六"],
		              dayNames :["日","一","二","三","四","五","六"],
		              monthNamesShort  :["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"]
		            })
		            .on( "change", function() {
		              to.datepicker( "option", "minDate", $(this).val());
		            });

		   var to= $('#an_EndDate').datepicker({
		            dateFormat: "yy-mm-dd",
		            yearRange: "-10:+10",
		            changeMonth: true,
		            changeYear: true,
		            dayNamesMin :["日","一","二","三","四","五","六"],
		            dayNames :["日","一","二","三","四","五","六"],
		            monthNamesShort  :["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"]
		          })
		          .on( "change", function() {
		            from.datepicker( "option", "maxDate", $(this).val());
		          });

		    if ($('#an_StartDate' ).val()!='') {
		      to.datepicker( "option", "minDate", $('#an_StartDate' ).val());
		      $('#an_StartDate' ).val();
		    }

		    if ($('#an_EndDate' ).val()!='') {
		      from.datepicker( "option", "maxDate", $('#an_EndDate' ).val());
		      $('#an_EndDate' ).val();
		    }




		    //-- 比較日期 --
		     var cp_from= $('#com_StartDate' ).datepicker({
		               dateFormat: "yy-mm-dd",
		               yearRange: "-10:+10",
		               changeMonth: true,
		               changeYear: true,
		               dayNamesMin :["日","一","二","三","四","五","六"],
		               dayNames :["日","一","二","三","四","五","六"],
		               monthNamesShort  :["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"]
		             })
		             .on( "change", function() {
		               cp_to.datepicker( "option", "minDate", $(this).val());
		             });

		    var cp_to= $('#com_EndDate').datepicker({
		             dateFormat: "yy-mm-dd",
		             yearRange: "-10:+10",
		             changeMonth: true,
		             changeYear: true,
		             dayNamesMin :["日","一","二","三","四","五","六"],
		             dayNames :["日","一","二","三","四","五","六"],
		             monthNamesShort  :["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"]
		           })
		           .on( "change", function() {
		             cp_from.datepicker( "option", "maxDate", $(this).val());
		           });

		     if ($('#com_StartDate' ).val()!='') {
		       cp_to.datepicker( "option", "minDate", $('#com_StartDate' ).val());
		       $('#com_StartDate' ).val();
		     }

		     if ($('#com_EndDate' ).val()!='') {
		       cp_from.datepicker( "option", "maxDate", $('#com_EndDate' ).val());
		       $('#com_EndDate' ).val();
		     }
		});


		/*--- checkout 功能  ---*/
			// =============================== 檢查input ====================================
			function check_input(id, txt) {
				if ($(id).length > 0) {
					//-- 核取方塊、選取方塊 --
					if ($(id).attr('type') == 'radio' || $(id).attr('type') == 'checkbox') {
						if ($(id + ':checked').val() == undefined) {
							$(id).css('borderColor', 'red');
							return txt;
						} else {
							$(id).css('borderColor', 'rgba(0,0,0,0.1)');
							return "";
						}
					} else {
						if ($(id).val() == '' || $(id).val().search(/^(?:[^\~|\!|\#|\$|\%|\^|\&|\*|\(|\)|\=|\+|\{|\}|\[|\]|\"|\'|\<|\>]+)$/) == -1) {
							$(id).css('borderColor', 'red');
							return txt;
						} else {
							$(id).css('borderColor', 'rgba(0,0,0,0.1)');
							return "";
						}
					}
				} else {
					return txt;
				}
			}
	</script>
